name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add upstream repo
        run: git remote add upstream https://github.com/sallowayma-git/IELTS-practice.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream
        run: |
          # 1. 尝试合并上游分支，但不自动 commit
          git merge upstream/main --allow-unrelated-histories --no-commit || true

          # 2. 彻底还原并清理上游对 .github/workflows/ 目录的所有改动
          git reset HEAD .github/workflows/ || true
          git checkout -- .github/workflows/ || true
          git clean -fd .github/workflows/ || true

          # 3. 提交合并后的实际代码变更
          git commit -m "Chore: sync upstream changes" || true

      - name: Push changes
        run: git push origin main
