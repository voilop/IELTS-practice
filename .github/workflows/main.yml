name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add upstream repo
        run: git remote add upstream https://github.com/sallowayma-git/IELTS-practice.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream
        run: |
          # 1. 合并上游代码（不自动提交）
          git merge upstream/main --allow-unrelated-histories --no-commit || true
          
          # 2. 还原 .github/workflows/ 目录，避免触发 GitHub 的安全限制
          git checkout HEAD -- .github/workflows/
          
          # 3. 提交代码更新
          git commit -m "Chore: sync upstream changes" || true

      - name: Push changes
        run: git push origin main
